# Publishes to pub.dev when a tag like v1.2.3 is pushed.
# One-time setup on pub.dev: package Admin -> Automated publishing ->
# enable GitHub Actions, repository KSD-CO/swm-chart, tag pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev authenticates the workflow with OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: dart pub publish --force
