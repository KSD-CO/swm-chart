name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test example/test_driver
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Publish dry run
        run: dart pub publish --dry-run
