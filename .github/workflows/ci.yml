name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test example/test_driver
      - name: Analyze
        # Infos don't fail the build: newer stable releases deprecate
        # package:flutter/material.dart (for package:material_ui), which the
        # library keeps using so older Flutter versions can still depend on it.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Publish dry run
        run: dart pub publish --dry-run
