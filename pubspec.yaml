name: swm_chart
description: >-
  Stock World Monitor Charts: high-performance financial charts for Flutter,
  a native Dart port of TradingView Lightweight Charts.
version: 0.14.0
homepage: https://stockworldmonitor.com/
repository: https://github.com/KSD-CO/swm-chart
issue_tracker: https://github.com/KSD-CO/swm-chart/issues
screenshots:
  - description: SwmProChart - a ready-made trading screen with a top bar, drawing toolbar, indicators, a long position and anchored VWAP.
    path: screenshots/pro_chart.png
  - description: Indicator picker - the indicators on the chart and all 73 to add, searchable.
    path: screenshots/pro_indicators.png
  - description: The drawing toolbar - tools in groups - lines, channels, Fibonacci and Gann, patterns, forecasting, shapes, annotations.
    path: screenshots/pro_drawing_tools.png
  - description: Built-in indicators - Bollinger, EMA, RSI and MACD panes - with a legend following the crosshair.
    path: screenshots/indicators.png
  - description: Technical analysis - ZigZag, an automatic Elliott count, auto trendlines, support / resistance and candlestick patterns.
    path: screenshots/analysis.png
  - description: Drawing tools - Fibonacci retracement, Elliott wave, trend line, rectangle, resistance and text.
    path: screenshots/drawing_tools.png
  - description: Trading lines - position with P&L, take profit, stop loss, a buy limit order and a price alert.
    path: screenshots/orders.png
  - description: A volume profile per session with its value area and point of control.
    path: screenshots/session_volume_profile.png
  - description: Candlesticks with volume, SMA, an RSI pane, buy/sell markers and the crosshair.
    path: screenshots/trading_light.png
  - description: Watchlist with sparklines and a portfolio donut chart.
    path: screenshots/watchlist.png
topics:
  - chart
  - charts
  - finance
  - trading
  - candlestick

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
